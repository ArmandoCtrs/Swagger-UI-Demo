openapi: 3.0.0
info:
  version: '1'
  title: Test4
  description: Fourth test for API demo
paths:
  /students:
    get:
      summary: Your GET endpoint
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Students'
        '400':
          description: Bad Request
      operationId: get-students
      parameters:
        - schema:
            type: string
          in: query
          name: first_name
        - schema:
            type: string
          in: query
          name: last_name
        - schema:
            type: string
          in: query
          name: email
        - schema:
            type: array
            items:
              type: string
            minItems: 0
            maxItems: 100
          in: query
          name: classes
    post:
      summary: Your POST endpoint
      tags: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Students'
        '400':
          description: Bad Request
          content: {}
      operationId: post-students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Students'
  /classes:
    get:
      summary: Your GET endpoint
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classes'
        '400':
          description: Bad Request
      operationId: get-classes
      parameters:
        - schema:
            type: string
          in: query
          name: course_name
    post:
      summary: Your POST endpoint
      tags: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classes'
        '400':
          description: Bad Request
      operationId: post-classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Classes'
components:
  schemas:
    Students:
      type: object
      title: Students
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        classes:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Classes'
    Classes:
      title: Classes
      type: object
      properties:
        id:
          type: integer
          format: int64
        course_name:
          type: string
